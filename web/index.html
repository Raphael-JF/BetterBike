<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Waypoint BLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="./styles.css" />
</head>
<body>

    <div id="map"></div>

    <div id="panel">
        <div>Lat: <span id="lat">-</span></div>
        <div>Lon: <span id="lon">-</span></div>
        <button onclick="connectBLE()">Connect BLE</button>
        <button onclick="sendWaypoint()">Send waypoint</button>
        <button onclick="saveWaypoint()">Save waypoint</button>
        <button onclick="loadWaypoint()">Load waypoint</button>
        <button onclick="renameWaypoint()">Rename waypoint</button>
        <button onclick="deleteWaypoint()">Delete waypoint</button>
    </div>

    <script src="./app.js"></script>

</body>
</html>
