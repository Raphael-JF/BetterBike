<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Waypoint BLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div id="brand">
                <div id="brandMark">WB</div>
                <div id="brandText">
                    <div id="brandTitle">Waypoint BLE</div>
                    <div id="brandSubtitle">Pick, save and send waypoints</div>
                </div>
            </div>

            <div id="topbarActions">
                <button id="btnGoMenu" class="topbarBtn" type="button" aria-label="Back to menu" title="Back to menu">
                    Menu
                </button>
            </div>
        </header>

        <main id="main">
            <section id="menuView" class="view viewActive" aria-label="Main menu">
                <div class="menu">
                    <button id="btnOpenMap" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"></path>
                                <path d="M9 3v15"></path>
                                <path d="M15 6v15"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Open map</span>
                            <span class="menuBtnDesc">Select a waypoint on the map</span>
                        </span>
                    </button>

                    <button id="btnConnectBle" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6.5 6.5l11 11"></path>
                                <path d="M6.5 17.5l11-11"></path>
                                <path d="M12 2v20l6-6-6-4 6-4-6-6z"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Connect BLE</span>
                            <span class="menuBtnDesc">Pair and find a writable characteristic</span>
                        </span>
                    </button>

                    <button id="btnOpenCalibration" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2v4"></path>
                                <path d="M12 18v4"></path>
                                <path d="M4.93 4.93l2.83 2.83"></path>
                                <path d="M16.24 16.24l2.83 2.83"></path>
                                <path d="M2 12h4"></path>
                                <path d="M18 12h4"></path>
                                <path d="M4.93 19.07l2.83-2.83"></path>
                                <path d="M16.24 7.76l2.83-2.83"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Calibration</span>
                            <span class="menuBtnDesc">Live scatter + start/stop calibration</span>
                        </span>
                    </button>

                    <div class="menuStatus" id="statusLine" aria-live="polite">Not connected. No waypoint selected.</div>
                </div>
            </section>

            <section id="mapView" class="view" aria-label="Map view">
                <div id="mapViewWrap">
                    <div id="map"></div>

                    <div id="panel">
                        <div class="coords">
                            <div>Lat: <span id="lat">-</span></div>
                            <div>Lon: <span id="lon">-</span></div>
                        </div>

                        <div class="panelActions">
                            <button id="btnBackToMenu" type="button">Back</button>
                            <button id="btnCenterMarker" type="button">Center</button>
                            <button id="btnSendWaypoint" type="button">Send</button>
                        </div>

                        <div class="panelDivider" role="separator" aria-hidden="true"></div>

                        <div class="panelActions panelActionsWrap">
                            <button id="btnSaveWaypoint" type="button">Save</button>
                            <button id="btnLoadWaypoint" type="button">Load</button>
                            <button id="btnRenameWaypoint" type="button">Rename</button>
                            <button id="btnDeleteWaypoint" type="button" class="danger">Delete</button>
                        </div>

                        <div class="panelHint" id="mapHint" aria-live="polite">
                            Tip: click on the map to select a waypoint.
                        </div>
                    </div>
                </div>
            </section>

            <section id="calibrationView" class="view" aria-label="Calibration view">
                <div id="calibrationViewWrap">
                    <canvas id="calibrationCanvas" width="900" height="520"></canvas>

                    <div id="panel">
                        <div class="coords">
                            <div>Comp X offset: <span id="compX">-</span></div>
                            <div>Comp Y offset: <span id="compY">-</span></div>
                        </div>

                        <div class="panelActions">
                            <button id="btnBackToMenuCal" type="button">Back</button>
                            <button id="btnToggleCalibrateLive" type="button" aria-pressed="false">Start calibration</button>
                            <button id="btnClearCalPlot" type="button">Clear</button>
                        </div>

                        <div class="panelHint" aria-live="polite">
                            Live magnetometer scatter from the bike (BLE notifications).
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div id="toastHost" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script src="./constants.js"></script>
    <script src="./bluetooth.js"></script>
    <script src="./app.js"></script>
</body>
</html>
