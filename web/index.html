<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Waypoint BLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div id="brand">
                <div id="brandMark">WB</div>
                <div id="brandText">
                    <div id="brandTitle">Waypoint BLE</div>
                    <div id="brandSubtitle">Pick, save and send waypoints</div>
                </div>
            </div>

            <div id="topbarActions">
                <button id="btnGoMenu" class="topbarBtn" type="button" aria-label="Back to menu" title="Back to menu">
                    Menu
                </button>
            </div>
        </header>

        <main id="main">
            <section id="menuView" class="view viewActive" aria-label="Main menu">
                <div class="menu">
                    <button id="btnOpenMap" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"></path>
                                <path d="M9 3v15"></path>
                                <path d="M15 6v15"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Open map</span>
                            <span class="menuBtnDesc">Select a waypoint on the map</span>
                        </span>
                    </button>

                    <button id="btnConnectBle" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6.5 6.5l11 11"></path>
                                <path d="M6.5 17.5l11-11"></path>
                                <path d="M12 2v20l6-6-6-4 6-4-6-6z"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Connect BLE</span>
                            <span class="menuBtnDesc">Pair and find a writable characteristic</span>
                        </span>
                    </button>

                    <button id="btnSendWaypoint" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 2L11 13"></path>
                                <path d="M22 2l-7 20-4-9-9-4z"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Send waypoint</span>
                            <span class="menuBtnDesc">Transmit the selected coordinates</span>
                        </span>
                    </button>

                    <button id="btnSaveWaypoint" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <path d="M17 21v-8H7v8"></path>
                                <path d="M7 3v5h8"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Save waypoint</span>
                            <span class="menuBtnDesc">Store locally in your browser</span>
                        </span>
                    </button>

                    <button id="btnLoadWaypoint" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <path d="M7 10l5 5 5-5"></path>
                                <path d="M12 15V3"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Load waypoint</span>
                            <span class="menuBtnDesc">Pick from saved items</span>
                        </span>
                    </button>

                    <button id="btnRenameWaypoint" class="menuBtn" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Rename waypoint</span>
                            <span class="menuBtnDesc">Edit a saved name</span>
                        </span>
                    </button>

                    <button id="btnDeleteWaypoint" class="menuBtn menuBtnDanger" type="button">
                        <span class="menuBtnIcon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M8 6V4h8v2"></path>
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                                <path d="M10 11v6"></path>
                                <path d="M14 11v6"></path>
                            </svg>
                        </span>
                        <span class="menuBtnText">
                            <span class="menuBtnTitle">Delete waypoint</span>
                            <span class="menuBtnDesc">Remove a saved item</span>
                        </span>
                    </button>

                    <div class="menuStatus" id="statusLine" aria-live="polite">Not connected. No waypoint selected.</div>
                </div>
            </section>

            <section id="mapView" class="view" aria-label="Map view">
                <div id="map"></div>

                <div id="panel">
                    <div class="coords">
                        <div>Lat: <span id="lat">-</span></div>
                        <div>Lon: <span id="lon">-</span></div>
                    </div>

                    <div class="panelActions">
                        <button id="btnBackToMenu" type="button">Back</button>
                        <button id="btnCenterMarker" type="button">Center</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="./app.js"></script>
</body>
</html>
